<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cap body -->
  <rect x="8" y="20" width="14" height="7" rx="2" fill="white"/>
  <ellipse cx="15" cy="27" rx="7" ry="2" fill="rgba(255,255,255,0.6)"/>

  <!-- Mortarboard — face avant (légèrement grisée pour la profondeur) -->
  <polygon points="15,13 29,20 15,20 1,13" fill="#cbd5e1"/>
  <!-- Mortarboard — face supérieure (blanche) -->
  <polygon points="15,5 29,13 15,20 1,13" fill="white"/>
  <!-- Reflet sur la moitié avant -->
  <polygon points="15,5 29,13 22,16.5 8,16.5" fill="white"/>

  <!-- Pompon central (or) -->
  <circle cx="15" cy="13" r="1.4" fill="#f59e0b"/>

  <!-- Cordon de la toque (or) -->
  <line x1="28.5" y1="13" x2="28.5" y2="25" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Pompon de la toque (or) -->
  <circle cx="28.5" cy="27" r="2.4" fill="#f59e0b"/>
</svg>
